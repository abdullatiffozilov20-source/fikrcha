<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIKRCHA Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", system-ui;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .login-card {
        background: white;
        padding: 48px 40px;
        border-radius: 32px;
        text-align: center;
        max-width: 450px;
        width: 100%;
      }
      h1 {
        font-size: 3rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
      }
      p { color: #6c757d; font-size: 1rem; margin-bottom: 28px; }
      .tg-btn {
        background: #2AABEE;
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 17px;
        border-radius: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        font-weight: 600;
        transition: background 0.2s;
        margin-bottom: 12px;
        text-decoration: none;
      }
      .tg-btn:hover { background: #1a96d4; }
      .google-btn {
        background: #f1f3f5;
        color: #495057;
        border: none;
        padding: 14px 32px;
        font-size: 15px;
        border-radius: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        font-weight: 600;
        transition: background 0.2s;
        text-decoration: none;
      }
      .google-btn:hover { background: #e9ecef; }
      .note { margin-top: 16px; font-size: 13px; color: #999; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>✨ FIKRCHA</h1>
      <p>think · grow · achieve</p>
      <button class="tg-btn" onclick="loginWithTelegram()">
        ✈️ Continue with Telegram
      </button>
      <a id="googleBtn" href="/auth/google" class="google-btn">
        🔑 Sign in with Google
      </a>
      <p id="tgNote" class="note" style="display:none;">
        A browser window will open for Google sign-in.
      </p>
    </div>
    <script>
      const inTelegram = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
      const googleBtn = document.getElementById("googleBtn");
      const note = document.getElementById("tgNote");

      if (inTelegram) {
        note.style.display = "block";
        googleBtn.addEventListener("click", function(e) {
          e.preventDefault();
          window.Telegram.WebApp.openLink(window.location.origin + "/auth/google");
        });
      }

      function loginWithTelegram() {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          const user = tg.initDataUnsafe.user;
          fetch('/auth/telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user })
          }).then(r => r.json()).then(data => {
            if (data.success) window.location = '/app.html';
            else alert('Login failed. Please try again.');
          });
        } else {
          alert('Please open this app from Telegram!');
        }
      }
    </script>
  </body>
</html>
