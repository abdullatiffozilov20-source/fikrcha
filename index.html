<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIKRCHA Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .login-card {
        background: white;
        padding: 48px 40px;
        border-radius: 32px;
        text-align: center;
        max-width: 450px;
        width: 100%;
      }
      h1 {
        font-size: 3rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
      }
      p {
        color: #6c757d;
        font-size: 1rem;
      }
      .google-btn {
        background: #4285f4;
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 17px;
        border-radius: 40px;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
        width: 100%;
        font-weight: 600;
        transition: background 0.2s;
      }
      .google-btn:hover {
        background: #357ae8;
      }
      .note {
        margin-top: 16px;
        font-size: 13px;
        color: #999;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 36px 24px;
          border-radius: 24px;
        }
        h1 {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>✨ FIKRCHA</h1>
      <p>think · grow · achieve</p>
      <a id="loginBtn" href="/auth/google" class="google-btn">
        <span>🔑</span> Sign in with Google
      </a>
      <p id="tgNote" class="note" style="display:none;">
        A browser window will open for sign-in.
      </p>
    </div>
    <script>
      const btn = document.getElementById("loginBtn");
      const note = document.getElementById("tgNote");
      const authUrl = window.location.origin + "/auth/google";

      const inTelegram = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;

      if (inTelegram) {
        note.style.display = "block";
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          window.Telegram.WebApp.openLink(authUrl);
        });
      }
    </script>
  </body>
</html>
